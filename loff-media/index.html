<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#2C4A2E">

  <title>Лофф.Медиа</title>

  <style>
    :root {
      --bg: #f3f3ef;
      --surface: #ffffff;
      --surface-2: #eceee9;

      --text: #171a18;
      --muted: #6f766f;

      --primary: #2C4A2E;
      --primary-hover: #3b613e;

      --cream: #D9C8A4;

      --border: rgba(44, 74, 46, .14);
      --shadow: 0 8px 30px rgba(25, 35, 27, .07);

      --radius: 16px;
    }

    body.dark {
      --bg: #0c100d;
      --surface: #141914;
      --surface-2: #1c221d;

      --text: #f1f3ef;
      --muted: #aeb6ae;

      --primary: #9fbe9f;
      --primary-hover: #b5cfb5;

      --cream: #D9C8A4;

      --border: rgba(217, 200, 164, .13);
      --shadow: 0 10px 35px rgba(0, 0, 0, .22);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      -webkit-font-smoothing: antialiased;

      transition:
        background .25s ease,
        color .25s ease;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .app {
      width: min(1250px, 100%);
      min-height: 100vh;

      margin: auto;

      padding: 12px;

      display: flex;
      flex-direction: column;

      gap: 10px;
    }

    /* HEADER */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 17px 19px;

      background: var(--surface);

      border: 1px solid var(--border);
      border-radius: var(--radius);

      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;

      display: grid;
      place-items: center;

      border-radius: 10px;

      background: var(--primary);
      color: var(--bg);

      font-size: 16px;
      font-weight: 900;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 850;

      letter-spacing: -.045em;
    }

    .brand-subtitle {
      margin-top: 2px;

      color: var(--muted);

      font-size: 9px;
    }

    .header-actions {
      display: flex;
      gap: 7px;
    }

    .icon-button {
      width: 34px;
      height: 34px;

      display: grid;
      place-items: center;

      border-radius: 10px;

      background: var(--surface-2);
      color: var(--text);

      border: 1px solid var(--border);

      cursor: pointer;

      transition:
        background .2s,
        transform .2s;
    }

    .icon-button:hover {
      background: var(--primary);
      color: var(--bg);

      transform: translateY(-1px);
    }

    /* INFO */

    .info-panel {
      display: grid;

      grid-template-columns: 1.5fr 1fr 1fr;

      gap: 8px;
    }

    .info-card {
      min-height: 76px;

      padding: 14px 16px;

      display: flex;
      flex-direction: column;
      justify-content: center;

      background: var(--surface);

      border: 1px solid var(--border);
      border-radius: var(--radius);

      box-shadow: var(--shadow);
    }

    .info-label {
      color: var(--muted);

      font-size: 9px;
      font-weight: 650;

      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .info-value {
      margin-top: 5px;

      font-size: 16px;
      font-weight: 800;

      letter-spacing: -.04em;
    }

    .info-small {
      margin-top: 3px;

      color: var(--muted);

      font-size: 9px;
    }

    .last-service {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .last-service-icon {
      width: 31px;
      height: 31px;

      border-radius: 8px;

      object-fit: contain;

      background: var(--surface-2);

      border: 1px solid var(--border);

      padding: 5px;
    }

    /* SEARCH */

    .search-box {
      display: flex;
      align-items: stretch;

      min-height: 52px;

      background: var(--surface);

      border: 1px solid var(--border);
      border-radius: var(--radius);

      box-shadow: var(--shadow);

      overflow: hidden;
    }

    .search-engine {
      position: relative;

      width: 130px;

      flex-shrink: 0;
    }

    .search-engine select {
      width: 100%;
      height: 100%;

      appearance: none;

      padding: 0 30px 0 15px;

      border: 0;
      outline: 0;

      background: var(--surface-2);

      color: var(--text);

      font-size: 10px;
      font-weight: 750;

      cursor: pointer;
    }

    .search-engine::after {
      content: "⌄";

      position: absolute;

      right: 11px;
      top: 50%;

      transform: translateY(-55%);

      color: var(--muted);

      pointer-events: none;
    }

    .search-input-wrap {
      flex: 1;

      display: flex;
      align-items: center;
    }

    .search-symbol {
      padding-left: 15px;

      color: var(--muted);

      font-size: 16px;
    }

    #web-search {
      width: 100%;
      height: 100%;

      padding: 0 12px;

      border: 0;
      outline: 0;

      background: transparent;

      color: var(--text);

      font-size: 12px;
    }

    #web-search::placeholder {
      color: var(--muted);
    }

    .search-submit {
      width: 48px;

      margin: 6px;

      border-radius: 10px;

      background: var(--primary);
      color: var(--bg);

      cursor: pointer;

      font-size: 16px;
      font-weight: 800;

      transition:
        background .2s,
        transform .2s;
    }

    .search-submit:hover {
      background: var(--primary-hover);
      transform: scale(.97);
    }

    /* CATEGORY NAV */

    .category-nav {
      display: flex;
      gap: 6px;

      overflow-x: auto;

      padding-bottom: 2px;

      scrollbar-width: none;
    }

    .category-nav::-webkit-scrollbar {
      display: none;
    }

    .category {
      height: 35px;

      flex-shrink: 0;

      padding: 0 13px;

      display: flex;
      align-items: center;
      gap: 7px;

      border-radius: 10px;

      background: var(--surface);

      border: 1px solid var(--border);

      color: var(--muted);

      cursor: pointer;

      font-size: 10px;
      font-weight: 700;

      transition:
        background .2s,
        color .2s,
        border-color .2s;
    }

    .category:hover {
      color: var(--text);
    }

    .category.active {
      background: var(--primary);
      border-color: var(--primary);

      color: var(--bg);
    }

    .category-icon {
      font-size: 13px;
    }

    /* CONTENT */

    .content {
      padding: 18px;

      background: var(--surface);

      border: 1px solid var(--border);
      border-radius: var(--radius);

      box-shadow: var(--shadow);
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;

      margin-bottom: 14px;
    }

    .section-title {
      margin: 0;

      font-size: 20px;
      font-weight: 850;

      letter-spacing: -.055em;
    }

    .section-description {
      margin: 4px 0 0;

      color: var(--muted);

      font-size: 10px;
    }

    .section-count {
      color: var(--muted);

      font-size: 9px;
    }

    /* CARDS */

    .cards {
      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 9px;
    }

    .service {
      min-height: 164px;

      padding: 14px;

      display: flex;
      flex-direction: column;

      background: var(--surface-2);

      border: 1px solid var(--border);
      border-radius: 13px;

      cursor: pointer;

      animation: cardIn .28s ease both;

      transition:
        transform .2s ease,
        background .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;
    }

    .service:hover {
      transform: translateY(-3px);

      background: var(--surface);

      border-color: var(--primary);

      box-shadow:
        0 8px 25px rgba(44, 74, 46, .08);
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(7px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .service-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .service-logo {
      width: 48px;
      height: 48px;

      padding: 7px;

      object-fit: contain;

      border-radius: 11px;

      background: var(--surface);

      border: 1px solid var(--border);
    }

    .service-logo-fallback {
      width: 48px;
      height: 48px;

      display: grid;
      place-items: center;

      border-radius: 11px;

      background: var(--primary);

      color: var(--bg);

      font-size: 15px;
      font-weight: 850;
    }

    .service-actions {
      display: flex;
      gap: 5px;
    }

    .service-arrow,
    .favorite-button {
      width: 26px;
      height: 26px;

      display: grid;
      place-items: center;

      border-radius: 50%;

      background: var(--surface);

      color: var(--muted);

      font-size: 12px;

      transition:
        background .2s,
        color .2s,
        transform .2s;
    }

    .favorite-button {
      cursor: pointer;
      font-size: 14px;
    }

    .favorite-button:hover {
      transform: scale(1.08);
    }

    .favorite-button.active {
      color: var(--cream);
      background: var(--primary);
    }

    .service:hover .service-arrow {
      background: var(--primary);
      color: var(--bg);
    }

    .service-info {
      margin-top: auto;
      padding-top: 18px;
    }

    .service-name {
      margin: 0;

      font-size: 12px;
      font-weight: 800;

      letter-spacing: -.025em;
    }

    .service-description {
      margin: 5px 0 0;

      color: var(--muted);

      font-size: 9px;

      line-height: 1.5;
    }

    /* EMPTY */

    .empty {
      grid-column: 1 / -1;

      padding: 50px 15px;

      text-align: center;

      color: var(--muted);
    }

    .empty-icon {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .empty-title {
      color: var(--text);

      font-size: 13px;
      font-weight: 750;
    }

    .empty-text {
      margin-top: 5px;

      font-size: 10px;
    }

    /* FOOTER */

    .footer {
      padding: 4px 4px 8px;

      display: flex;
      justify-content: space-between;

      color: var(--muted);

      font-size: 8px;
    }

    .footer a {
      color: var(--primary);
      font-weight: 700;
    }

    /* TOAST */

    .toast {
      position: fixed;

      left: 50%;
      bottom: 22px;

      transform:
        translate(-50%, 20px);

      padding: 10px 15px;

      background: var(--primary);
      color: var(--bg);

      border-radius: 11px;

      font-size: 10px;
      font-weight: 750;

      opacity: 0;
      pointer-events: none;

      transition:
        opacity .2s,
        transform .2s;

      z-index: 100;
    }

    .toast.show {
      opacity: 1;

      transform:
        translate(-50%, 0);
    }

    /* MOBILE */

    @media (max-width: 900px) {

      .cards {
        grid-template-columns:
          repeat(3, minmax(0, 1fr));
      }

    }

    @media (max-width: 680px) {

      .app {
        padding: 7px;
        gap: 7px;
      }

      .info-panel {
        grid-template-columns:
          1fr 1fr;
      }

      .info-card:first-child {
        grid-column: span 2;
      }

      .cards {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .content {
        padding: 13px;
      }

    }

    @media (max-width: 480px) {

      .header {
        padding: 13px;
      }

      .brand-subtitle {
        display: none;
      }

      .brand-title {
        font-size: 14px;
      }

      .info-card {
        min-height: 67px;
        padding: 11px 12px;
      }

      .info-value {
        font-size: 14px;
      }

      .search-box {
        min-height: 47px;
      }

      .search-engine {
        width: 105px;
      }

      .search-engine select {
        font-size: 9px;
      }

      .search-submit {
        width: 42px;
      }

      .section-title {
        font-size: 18px;
      }

      .service {
        min-height: 151px;
        padding: 11px;
      }

      .service-logo,
      .service-logo-fallback {
        width: 43px;
        height: 43px;
      }

      .service-description {
        font-size: 8px;
      }

      .footer {
        display: none;
      }

    }

    @media (max-width: 350px) {

      .cards {
        grid-template-columns: 1fr;
      }

      .service {
        min-height: 125px;
      }

      .info-panel {
        grid-template-columns: 1fr;
      }

      .info-card:first-child {
        grid-column: auto;
      }

    }
  </style>
</head>

    </button>

  </nav>


  <!-- CONTENT -->

  <main class="content">

    <div class="section-heading">

      <div>

  </main>


  <footer class="footer">

      Лофф.Медиа · Borisloff.Dev
    </span>

    <a href="https://borisloff.github.io">
      borisloff.github.io
    </a>

</div>

  /* =====================================================
     STATE
  ===================================================== */

  let favorites =
    JSON.parse(
      localStorage.getItem("loffFavorites") || "[]"
    );

  let currentSection =
    localStorage.getItem("loffMediaSection") || "music";

  let currentQuery = "";


  /* =====================================================
     ELEMENTS
  ===================================================== */

  const cards =
    document.getElementById("cards");

  const sectionTitle =
    document.getElementById("section-title");

  const sectionDescription =
    document.getElementById("section-description");

  const sectionCount =
    document.getElementById("section-count");

  const serviceCount =
    document.getElementById("service-count");

  const lastService =
    document.getElementById("last-service");


  /* =====================================================
     HELPERS
  ===================================================== */

  function allServices() {

    return Object.values(sections)
      .flatMap(section => section.items);

  }


  function isFavorite(url) {

    return favorites.includes(url);

  }


  function saveFavorites() {

    localStorage.setItem(
      "loffFavorites",
      JSON.stringify(favorites)
    );

  }


  function toggleFavorite(url) {

    if (isFavorite(url)) {

      favorites =
        favorites.filter(
          item => item !== url
        );

      showToast("Убрано из избранного");

    } else {

      favorites.push(url);

      showToast("Добавлено в избранное");

    }

    saveFavorites();

    render(
      currentSection,
      currentQuery
    );

    updateStats();

  }


  function showToast(text) {

    const toast =
      document.getElementById("toast");

    toast.textContent = text;

    toast.classList.add("show");

    clearTimeout(
      window.toastTimer
    );

    window.toastTimer =
      setTimeout(() => {

        toast.classList.remove("show");

      }, 1700);

  }


  function escapeHTML(value) {

    return value
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  /* =====================================================
     STATS
  ===================================================== */

  function updateStats() {

    const total =
      allServices().length;

    serviceCount.textContent =
      `${total} сервис`;

  }


  /* =====================================================
     LAST SERVICE
  ===================================================== */

  function updateLastService() {

    const url =
      localStorage.getItem(
        "loffLastService"
      );

    if (!url) {

      lastService.innerHTML = `
        <div>
          <div class="info-value">
            Пока пусто
          </div>

          <div class="info-small">
            Открытые сервисы появятся здесь
          </div>
        </div>
      `;

      return;

    }


    const service =
      allServices()
        .find(item => item[1] === url);


    if (!service) {

      lastService.innerHTML = `
        <div class="info-value">
          Пока пусто
        </div>
      `;

      return;

    }


    const [
      name,
      serviceUrl,
      logo
    ] = service;


    lastService.innerHTML = `

      <img
        class="last-service-icon"
        src="${logo}"
        alt=""
        onerror="this.style.display='none'">

      <div>

        <div
          class="info-value"
          style="font-size:12px">
          ${escapeHTML(name)}
        </div>

        <div class="info-small">
          Открыть ↗
        </div>

      </div>

    `;


    lastService.onclick =
      () => openService(service);

    lastService.style.cursor =
      "pointer";

  }


  /* =====================================================
     OPEN SERVICE
  ===================================================== */

  function openService(item) {

    const [
      name,
      url
    ] = item;


    localStorage.setItem(
      "loffLastService",
      url
    );


    updateLastService();


    window.open(
      url,
      "_blank",
      "noopener,noreferrer"
    );

  }


  /* =====================================================
     RENDER
  ===================================================== */

  function render(
    section,
    query = ""
  ) {

    currentSection = section;
    currentQuery = query;

    localStorage.setItem(
      "loffMediaSection",
      section
    );


    let data;


    if (section === "favorites") {

      data = {

        title: "Избранное",

        description:
          "Ваши сохранённые сервисы",

        items:
          allServices()
            .filter(
              item => isFavorite(item[1])
            )

      };

    } else {

      data =
        sections[section];

    }


    if (!data) return;


    sectionTitle.textContent =
      data.title;

    sectionDescription.textContent =
      data.description;


    const normalizedQuery =
      query.trim().toLowerCase();


    const filtered =
      data.items.filter(item => {

        const name =
          item[0].toLowerCase();

        const description =
          item[3].toLowerCase();

        return (
          name.includes(normalizedQuery) ||
          description.includes(normalizedQuery)
        );

      });


    sectionCount.textContent =
      query
        ? `${filtered.length} из ${data.items.length}`
        : `${data.items.length} сервисов`;


    cards.innerHTML = "";


    if (!filtered.length) {

      if (
        section === "favorites"
      ) {

        cards.innerHTML = `

          <div class="empty">

            <div class="empty-icon">
              ★
            </div>

            <div class="empty-title">
              Здесь пока пусто
            </div>

            <div class="empty-text">
              Нажми ★ на любом сервисе,
              чтобы добавить его сюда.
            </div>

          </div>

        `;

      } else {

        cards.innerHTML = `

          <div class="empty">

            <div class="empty-icon">
              ⌕
            </div>

            <div class="empty-title">
              Ничего не найдено
            </div>

            <div class="empty-text">
              Попробуй изменить поисковый запрос.
            </div>

          </div>

        `;

      }

      return;

    }


    filtered.forEach(
      (item, index) => {

        const [
          name,
          url,
          logo,
          description
        ] = item;


        const card =
          document.createElement("article");


        card.className =
          "service";


        card.style.animationDelay =
          `${index * 25}ms`;


        const logoElement =
          document.createElement("img");


        logoElement.className =
          "service-logo";


        logoElement.src =
          logo;

        logoElement.alt =
          name;

        logoElement.loading =
          "lazy";


        logoElement.onerror =
          function () {

            const fallback =
              document.createElement("div");

            fallback.className =
              "service-logo-fallback";

            fallback.textContent =
              name
                .charAt(0)
                .toUpperCase();


            this.replaceWith(
              fallback
            );

          };


        card.innerHTML = `

          <div class="service-top">

            <div class="logo-placeholder"></div>

            <div class="service-actions">

              <button
                class="favorite-button ${
                  isFavorite(url)
                    ? "active"
                    : ""
                }"
                title="${
                  isFavorite(url)
                    ? "Убрать из избранного"
                    : "Добавить в избранное"
                }">

                ${
                  isFavorite(url)
                    ? "★"
                    : "☆"
                }

              </button>

              <span class="service-arrow">
                ↗
              </span>

            </div>

          </div>


          <div class="service-info">

            <h2 class="service-name">
              ${escapeHTML(name)}
            </h2>

            <p class="service-description">
              ${escapeHTML(description)}
            </p>

          </div>

        `;


        card
          .querySelector(".logo-placeholder")
          .replaceWith(
            logoElement
          );


        const favoriteButton =
          card.querySelector(
            ".favorite-button"
          );


        favoriteButton.addEventListener(
          "click",
          event => {

            event.stopPropagation();

            toggleFavorite(url);

          }
        );


        card.addEventListener(
          "click",
          () => {

            openService(item);

          }
        );


        cards.appendChild(card);

      }
    );

  }


  /* =====================================================
     CATEGORY NAV
  ===================================================== */

  document
    .querySelectorAll(".category")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(".category")
            .forEach(item =>
              item.classList.remove(
                "active"
              )
            );


          button.classList.add(
            "active"
          );


          currentSection =
            button.dataset.section;


          render(
            currentSection,
            currentQuery
          );

        }
      );

    });


  /* =====================================================
     SEARCH
  ===================================================== */

  const searchForm =
    document.getElementById(
      "search-form"
    );


  const webSearch =
    document.getElementById(
      "web-search"
    );


  const searchEngine =
    document.getElementById(
      "search-engine"
    );


  searchEngine.value =
    localStorage.getItem(
      "loffSearchEngine"
    ) || "yandex";


  searchEngine.addEventListener(
    "change",
    () => {

      localStorage.setItem(
        "loffSearchEngine",
        searchEngine.value
      );

    }
  );


  const engines = {

    yandex:
      "https://yandex.ru/search/?text=",

    google:
      "https://www.google.com/search?q=",

    bing:
      "https://www.bing.com/search?q=",

    duckduckgo:
      "https://duckduckgo.com/?q="

  };


  searchForm.addEventListener(
    "submit",
    event => {

      event.preventDefault();


      const query =
        webSearch.value.trim();


      if (!query) return;


      const url =
        engines[
          searchEngine.value
        ] +
        encodeURIComponent(query);


      window.open(
        url,
        "_blank",
        "noopener,noreferrer"
      );

    }
  );


  /* =====================================================
     CTRL + K
  ===================================================== */

  document.addEventListener(
    "keydown",
    event => {

      if (
        (event.ctrlKey || event.metaKey) &&
        event.key.toLowerCase() === "k"
      ) {

        event.preventDefault();

        webSearch.focus();

      }

    }
  );


  /* =====================================================
     THEME
  ===================================================== */

  if (
    localStorage.getItem(
      "loffTheme"
    ) === "dark"
  ) {

    document.body.classList.add(
      "dark"
    );

  }


  function toggleTheme() {

    const dark =
      document.body.classList.toggle(
        "dark"
      );


    localStorage.setItem(
      "loffTheme",
      dark
        ? "dark"
        : "light"
    );

  }


  /* =====================================================
     DATE / TIME
  ===================================================== */

  function updateDateTime() {

    const now =
      new Date();


    const date =
      now.toLocaleDateString(
        "ru-RU",
        {
          weekday: "long",
          day: "numeric",
          month: "long"
        }
      );


    document
      .getElementById("date")
      .textContent =
      date.charAt(0).toUpperCase() +
      date.slice(1);


    document
      .getElementById("time")
      .textContent =
      now.toLocaleTimeString(
        "ru-RU",
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );

  }


  /* =====================================================
     INITIAL
  ===================================================== */

  updateDateTime();

  setInterval(
    updateDateTime,
    1000
  );


  updateStats();

  updateLastService();


  document
    .querySelectorAll(".category")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.section ===
          currentSection
      );

    });


  render(
    currentSection
  );

</script>
